name: CI — Build & Test

on:
  push:
    branches: 
      -'**'     # triggers on every push to any branch
  pull_request:
    branches: 
      -'**'        # triggers on every pull request

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test